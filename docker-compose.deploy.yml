services:
  my-panel:
    build: .
    image: my-panel:latest
    container_name: my-panel
    restart: unless-stopped
    ports:
      - "3958:3958"
    volumes:
      - /:/host
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/my-panel/compose_projects:/app/compose_projects
      - /root/my-panel/data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - PORT=3958
      - RABBIT_UPDATE_CHECK_DISABLED=true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3958/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
